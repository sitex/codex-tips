name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  installer-unix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run installer regression
        run: bash tests/install-codex-tips.sh
      - name: Lint shell scripts
        if: runner.os == 'Linux'
        run: shellcheck bin/install-codex-tips tests/install-codex-tips.sh

  installer-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run installer regression
        shell: pwsh
        run: ./tests/install-codex-tips.ps1

  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "0.151.0"
            commit: 78c290807ce710180111df227df3b7a4fe845452
          - version: "0.152.0"
            commit: 316795b3cf2a45e90d121d9f46499d4658b2645c
    steps:
      - uses: actions/checkout@v4
      - name: Check pinned upstream patch
        run: |
          checkout="/tmp/codex-tips-upstream-${{ matrix.version }}"
          git clone --depth 1 --branch "rust-v${{ matrix.version }}" https://github.com/openai/codex.git "$checkout"
          test "$(git -C "$checkout" rev-parse HEAD)" = "${{ matrix.commit }}"
          git -C "$checkout" apply --check "$GITHUB_WORKSPACE/patches/codex-tips/rust-v${{ matrix.version }}.patch"
