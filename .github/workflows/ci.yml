name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  installer-unix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run installer regression
        run: bash tests/install-codex-tips.sh
      - name: Lint shell scripts
        if: runner.os == 'Linux'
        run: shellcheck bin/install-codex-tips tests/install-codex-tips.sh

  installer-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run installer regression
        shell: pwsh
        run: ./tests/install-codex-tips.ps1

  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check pinned upstream patch
        run: |
          git clone --depth 1 --branch rust-v0.152.0 https://github.com/openai/codex.git /tmp/codex-tips-upstream
          test "$(git -C /tmp/codex-tips-upstream rev-parse HEAD)" = 316795b3cf2a45e90d121d9f46499d4658b2645c
          git -C /tmp/codex-tips-upstream apply --check "$GITHUB_WORKSPACE/patches/codex-tips/rust-v0.152.0.patch"
