name: Full platform build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install official Codex
        run: npm install --global @openai/codex@0.151.0
      - name: Install Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Build and install codex-tips
        run: ./bin/install-codex-tips
      - name: Exercise installed command
        run: ~/.local/bin/codex-tips --version | grep '0.151.0'

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install official Codex
        run: npm install --global @openai/codex@0.151.0
      - name: Install Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Build and install codex-tips
        shell: pwsh
        env:
          CODEX_TIPS_UPDATE_PATH: "0"
        run: ./bin/install-codex-tips.ps1
      - name: Exercise installed command
        shell: pwsh
        run: |
          $output = & "$env:LOCALAPPDATA\codex-tips\bin\codex-tips.cmd" --version
          if ($output -notmatch '0\.151\.0') { throw "unexpected version: $output" }
